# Only for testing the prm80 changes on Windows (not part of the pull request):
# builds Hamlib for 64-bit Windows with the mingw-w64 cross compiler and
# offers rigctl.exe, rigctld.exe and the DLLs as a ZIP under
# Actions > this run > Artifacts.
name: PRM80 Windows ZIP

on:
  push:
    branches: [prm80-windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - name: Install cross toolchain
      run: |
        sudo apt update
        sudo apt install -y mingw-w64 automake autoconf libtool texinfo
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: >-
        ./configure --host=x86_64-w64-mingw32
        --without-cxx-binding --without-libusb --without-samplerate
        --without-readline --disable-static
    - name: make
      run: make -j $(nproc) V=0 --no-print-directory
    - name: Collect files
      run: |
        mkdir -p hamlib-prm80-win64
        for exe in rigctl rigctld; do
          cp tests/.libs/$exe.exe hamlib-prm80-win64/ 2>/dev/null || cp tests/$exe.exe hamlib-prm80-win64/
        done
        cp src/.libs/libhamlib-*.dll hamlib-prm80-win64/
        cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll hamlib-prm80-win64/
        cp /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libgcc_s_seh-1.dll hamlib-prm80-win64/
        cp rigs/prm80/pysimulprm80.py hamlib-prm80-win64/ || true
        git log -1 --format='Hamlib %h %cd' > hamlib-prm80-win64/VERSION.txt
        ls -la hamlib-prm80-win64
    - uses: actions/upload-artifact@v7
      with:
        name: hamlib-prm80-win64
        path: hamlib-prm80-win64
